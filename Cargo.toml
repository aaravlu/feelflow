[package]
name = "feelflow"
version = "0.1.0"
edition = "2024"
description = "A modern note-taking app with LLM-based tag generation"

[dependencies]
anyhow = "1.0"
csv = "1.3"
makepad-widgets = { git = "https://github.com/makepad/makepad", branch = "dev" }
langchain-rust = "4.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
toml = "0.9"

[profile.dev]
debug = false
panic = "abort"
